    <script>
      (function() {
        try {
          var zoom = localStorage.getItem('motordesk_font_zoom');
          if (zoom === 'small') document.documentElement.classList.add('font-zoom-small');
          if (zoom === 'large') document.documentElement.classList.add('font-zoom-large');
          if (zoom === 'xlarge') document.documentElement.classList.add('font-zoom-xlarge');
        } catch(e) {}

        // Isolamento de rolagem nativo estanque: impede encadeamento (scroll-chaining) de eventos wheel
        function bindScrollBoundaryIsolation(el) {
          if (!el || el.__scrollIsolationBound) return;
          el.__scrollIsolationBound = true;
          el.addEventListener('wheel', function(e) {
            var atTop = el.scrollTop <= 0 && e.deltaY < 0;
            var atBottom = (el.scrollTop + el.clientHeight >= el.scrollHeight - 1) && e.deltaY > 0;
            if (atTop || atBottom) {
              e.preventDefault();
            }
            e.stopPropagation();
          }, { passive: false });
        }

        function setupScrollIsolation() {
          var sidebarNav = document.querySelector('#sidebar-container nav');
          var workspaceMain = document.querySelector('#workspace-main-content');
          if (sidebarNav) bindScrollBoundaryIsolation(sidebarNav);
          if (workspaceMain) bindScrollBoundaryIsolation(workspaceMain);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', setupScrollIsolation);
        } else {
          setupScrollIsolation();
        }

        var mutObs = new MutationObserver(function() {
          setupScrollIsolation();
        });
        mutObs.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
