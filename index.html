      /* =========================================================================
         Rolagem Fluida e Confortável - Isolamento entre Menu e Área Principal
         - Landing page e telas públicas têm rolagem vertical natural e completa
         - No ERP, o menu lateral tem barra de rolagem dedicada e independente
         - A área de trabalho principal (workspace) rola livremente sem cortes
         ========================================================================= */
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      #root {
        min-height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
      }

      /* Quando estiver no Workspace do ERP */
      #app-workspace-shell {
        height: 100vh;
        max-height: 100vh;
        width: 100%;
        max-width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: row;
        position: relative;
      }

      /* Container wrapper da barra lateral - NUNCA CORTAR EXPANSÃO */
      #app-workspace-shell > div:first-child {
        overflow: visible !important;
        z-index: 50 !important;
        position: relative !important;
      }

      #sidebar-container {
        height: 100vh;
        max-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        flex-shrink: 0;
        z-index: 50 !important;
        box-shadow: 4px 0 24px rgba(0, 0, 0, 0.45) !important;
      }

      /* Quando o menu expande no hover enquanto retraído */
      #sidebar-container:hover,
      #sidebar-container.w-64,
      #sidebar-container[class*="w-64"] {
        z-index: 99999 !important;
        box-shadow: 8px 0 35px rgba(0, 0, 0, 0.65) !important;
      }

      /* Barra de rolagem dedicada e de fácil visualização para o Menu Lateral */
      #sidebar-container nav,
      .custom-sidebar-nav-scroll {
        flex: 1 1 0% !important;
        min-height: 0 !important;
        overflow-y: auto !important;
        overflow-x: hidden !important;
        overscroll-behavior: contain !important;
        scrollbar-width: thin !important;
        scrollbar-color: #6366f1 #090d16 !important;
      }

      #sidebar-container nav::-webkit-scrollbar,
      .custom-sidebar-nav-scroll::-webkit-scrollbar {
        width: 8px !important;
      }

      #sidebar-container nav::-webkit-scrollbar-track,
      .custom-sidebar-nav-scroll::-webkit-scrollbar-track {
        background: #090d16 !important;
        border-radius: 4px !important;
      }

      #sidebar-container nav::-webkit-scrollbar-thumb,
      .custom-sidebar-nav-scroll::-webkit-scrollbar-thumb {
        background: #4f46e5 !important;
        border-radius: 4px !important;
        border: 1.5px solid #090d16 !important;
      }

      #sidebar-container nav::-webkit-scrollbar-thumb:hover,
      .custom-sidebar-nav-scroll::-webkit-scrollbar-thumb:hover {
        background: #818cf8 !important;
      }

      /* Barra de rolagem dedicada e suave para o Espaço de Trabalho (Workspace) */
      #workspace-main-content,
      .custom-workspace-scroll {
        flex: 1 1 0% !important;
        min-height: 0 !important;
        overflow-y: auto !important;
        overflow-x: hidden !important;

      /* =========================================================================
         SISTEMA RESPONSIVO DE MODAIS NA VIEWPORT (ENQUADRAMENTO PERFEITO)
         Garante que nenhuma janela ultrapasse a tela e que os botões de ação
         (Salvar, Cancelar, Confirmar, etc.) permaneçam sempre 100% visíveis e acessíveis.
         ========================================================================= */
      /* Backdrop Overlay do Modal */
      .fixed.inset-0.z-50,
      .fixed.inset-0.z-40,
      div[id$="-modal"],
      div[id*="-modal-overlay"],
      div[id="new-company-modal"] {
        box-sizing: border-box !important;
        overflow-y: auto !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        padding: 12px !important;
        -webkit-overflow-scrolling: touch !important;
      }

      /* Card Principal da Janela Modal: nunca excede a altura útil da tela */
      .fixed.inset-0.z-50 > div.bg-white,
      .fixed.inset-0.z-50 > div[class*="bg-slate-900"],
      .fixed.inset-0.z-40 > div.bg-white,
      div[id$="-modal"] > div.bg-white,
      div[id="new-company-modal"] > div.bg-white {
        margin: auto !important;
        max-height: calc(100vh - 24px) !important;
        max-height: calc(100dvh - 24px) !important;
        display: flex !important;
        flex-direction: column !important;
        overflow: hidden !important;
        box-sizing: border-box !important;
        border-radius: 1rem !important;
      }

      /* Cabeçalho da janela modal: sempre fixo no topo */
      .fixed.inset-0.z-50 > div.bg-white > div:first-child,
      .fixed.inset-0.z-40 > div.bg-white > div:first-child,
      div[id$="-modal"] > div.bg-white > div:first-child {
        flex-shrink: 0 !important;
      }

      /* Formulário direto dentro do modal: estrutura flex column sem quebrar o layout */
      .fixed.inset-0.z-50 > div.bg-white > form,
      div[id$="-modal"] > div.bg-white > form {
        display: flex !important;
        flex-direction: column !important;
        flex: 1 1 auto !important;
        min-height: 0 !important;
        max-height: 100% !important;
        overflow: hidden !important;
      }

      /* Área de rolagem do conteúdo do formulário */
      .fixed.inset-0.z-50 > div.bg-white > form > div:not(:last-child):not(.sticky):not(.shrink-0),
      div[id$="-modal"] > div.bg-white > form > div:not(:last-child):not(.sticky):not(.shrink-0) {
        overflow-y: auto !important;
        flex: 1 1 auto !important;
        min-height: 0 !important;
        -webkit-overflow-scrolling: touch !important;
      }

      /* Barra de Rodapé e Botões de Ação (Salvar, Cancelar, Confirmar, etc.):
         SEMPRE visíveis, com flex-shrink: 0 e fixados na base */
      .fixed.inset-0.z-50 .border-t.flex.justify-end,
      .fixed.inset-0.z-50 div[class*="border-t"][class*="justify-end"],
      .fixed.inset-0.z-50 form > div:last-child,
      div[id$="-modal"] .border-t.flex.justify-end,
      div[id$="-modal"] form > div:last-child {
        flex-shrink: 0 !important;
        position: sticky !important;
        bottom: 0 !important;
        background: #ffffff !important;
        z-index: 30 !important;
      }
    </style>
